- name: Checkout
  uses: actions/checkout@v6
- name: SFTP upload
  uses: Dylan700/sftp-upload-action@latest
  with:
    server: sftp.squig.link
    username: headphonezone
    password: ${{secrets.password}}
    port: 22
    uploads: |
      ./ => ./www/public_html/
    ignore: |
      *.git
      */**/*git*
